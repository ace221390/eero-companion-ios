name: Build EeroCompanion IPA

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger it manually from GitHub UI

jobs:
  build:
    runs-on: macos-14   # Xcode 15, free GitHub runner

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build unsigned IPA
        run: |
          cd EeroCompanion
          xcodebuild \
            -project EeroCompanion.xcodeproj \
            -scheme EeroCompanion \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=./build \
            build

          # Package .app into unsigned IPA
          mkdir -p Payload
          cp -r build/EeroCompanion.app Payload/
          zip -r EeroCompanion-unsigned.ipa Payload/
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EeroCompanion-unsigned-ipa
          path: EeroCompanion/EeroCompanion-unsigned.ipa
          retention-days: 30
